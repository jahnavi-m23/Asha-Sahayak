<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASHA Sahayak (आशा सहायक / ಆಶಾ ಸಹಾಯಕ) – Healthcare Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 and Babel Standalone for instant client execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;        /* Deep Medical Indigo */
      --primary-light: #eff6ff;
      --primary-hover: #172554;
      --teal: #0d9488;           /* Healthcare Teal */
      --teal-light: #f0fdfa;
      --danger: #dc2626;         /* Urgent Referral Crimson */
      --danger-light: #fef2f2;
      --warning: #d97706;        /* Warning Amber */
      --warning-light: #fffbeb;
      --success: #16a34a;        /* Confirmed Green */
      --success-light: #f0fdf4;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-500: #64748b;
      --gray-700: #334155;
      --gray-900: #0f172a;
      --sidebar-width: 260px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Kannada', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
      transition: transform 0.2s ease;
    }

    .sidebar-brand {
      padding: 20px 18px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--teal) 100%);
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
    }

    .brand-titles h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .brand-titles span {
      font-size: 11px;
      color: var(--gray-500);
      font-weight: 600;
      display: block;
    }

    .sidebar-menu {
      padding: 16px 12px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--gray-700);
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.15s ease;
      min-height: 44px;
    }

    .nav-item:hover {
      background: var(--gray-100);
      color: var(--gray-900);
    }

    .nav-item.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(30, 58, 138, 0.2);
    }

    .nav-item .icon {
      font-size: 17px;
      width: 22px;
      text-align: center;
    }

    .nav-badge {
      margin-left: auto;
      background: rgba(0, 0, 0, 0.08);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 9999px;
    }

    .nav-item.active .nav-badge {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #bfdbfe;
    }

    /* Main Content Wrapper */
    .content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Bar */
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid var(--gray-200);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .location-scope-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      background: var(--teal-light);
      padding: 6px 14px;
      border-radius: var(--radius-md);
      border: 1px solid #99f6e4;
      color: #0f766e;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-toggle-btn {
      background: #ffffff;
      border: 1px solid var(--gray-300);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: var(--gray-700);
    }

    .lang-toggle-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Page Canvas */
    .page-canvas {
      padding: 24px;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Filter Bar */
    .filter-bar-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-700);
    }

    .select-input {
      padding: 8px 12px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: 13px;
      background: #ffffff;
      color: var(--gray-900);
      outline: none;
      min-width: 150px;
      cursor: pointer;
    }

    .select-input:focus {
      border-color: var(--primary);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-card.urgent {
      border-left: 5px solid var(--danger);
      background: linear-gradient(135deg, #ffffff 80%, #fef2f2 100%);
    }

    .stat-card.highlight {
      border-left: 5px solid var(--teal);
    }

    .stat-title {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-500);
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--gray-900);
      margin: 8px 0;
    }

    .stat-card.urgent .stat-number {
      color: var(--danger);
    }

    .stat-sub {
      font-size: 12px;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Panels & Tables */
    .panel {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gray-900);
    }

    .table-responsive {
      overflow-x: auto;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    th {
      background: var(--gray-50);
      color: var(--gray-700);
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid var(--gray-200);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--gray-200);
      vertical-align: middle;
      color: var(--gray-900);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #fafafa;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-success { background: var(--success-light); color: var(--success); border: 1px solid #bbf7d0; }
    .badge-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
    .badge-warning { background: var(--warning-light); color: var(--warning); border: 1px solid #fde68a; }
    .badge-info { background: var(--primary-light); color: var(--primary); border: 1px solid #bfdbfe; }
    .badge-neutral { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-300); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      min-height: 42px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-secondary:hover:not(:disabled) { background: var(--gray-200); }
    .btn-teal { background: var(--teal); color: white; }
    .btn-teal:hover:not(:disabled) { background: #0f766e; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-sm { padding: 6px 12px; font-size: 12px; min-height: 32px; }

    .action-btn-group {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
    }

    /* Inputs & Validation Errors */
    .input-control {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      color: var(--gray-900);
      background: #ffffff;
      outline: none;
      min-height: 42px;
      transition: border-color 0.15s ease;
    }

    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
    }

    .input-control.has-error {
      border-color: var(--danger) !important;
      background: #fef2f2 !important;
    }

    .field-error-text {
      color: var(--danger);
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 4px;
      display: block;
    }

    /* Modal Backdrop & Sheets */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-sheet {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--gray-200);
    }

    .modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body { padding: 22px; }
    .modal-foot {
      padding: 16px 22px;
      border-top: 1px solid var(--gray-200);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      background: var(--gray-50);
    }

    .progress-bar-wrap {
      background: var(--gray-200);
      border-radius: 9999px;
      height: 8px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 9999px;
    }

    .member-builder-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
    }

    /* Success Alert Banner */
    .success-alert-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 6px solid var(--success);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .error-alert-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-left: 6px solid var(--danger);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      color: #991b1b;
      font-size: 13px;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: -280px;
        transition: left 0.25s ease;
      }
      .sidebar.open { left: 0; box-shadow: 0 0 30px rgba(0,0,0,0.3); }
      .mobile-menu-btn { display: block; }
    }

    /* Location Finder & Portal Styling */
    .finder-hero-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #0d9488 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 26px 24px;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.22);
    }
    .finder-search-box {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 18px;
      margin-top: 16px;
      box-shadow: var(--shadow-md);
      color: var(--gray-900);
    }
    .finder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }
    .finder-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .finder-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--teal);
    }
    .badge-verified {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .quick-nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .quick-nav-card {
      background: #ffffff;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.15s ease;
    }
    .quick-nav-card:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .quick-nav-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--gray-100);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .quick-pill {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quick-pill:hover {
      background: #ffffff;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

        setFinderLoading(true);
        setFinderMessage("");
        try {
          const params = overrideParams || finderForm;
          const queryParts = [];
          if (params.q) queryParts.push(`q=${encodeURIComponent(params.q)}`);
          if (params.pincode) queryParts.push(`pincode=${encodeURIComponent(params.pincode)}`);
          if (params.village) queryParts.push(`village=${encodeURIComponent(params.village)}`);
          if (params.locality) queryParts.push(`locality=${encodeURIComponent(params.locality)}`);
          if (params.taluk) queryParts.push(`taluk=${encodeURIComponent(params.taluk)}`);
          if (params.district) queryParts.push(`district=${encodeURIComponent(params.district)}`);
          if (params.lat != null) queryParts.push(`lat=${params.lat}`);
          if (params.lon != null) queryParts.push(`lon=${params.lon}`);

          const url = `${API_BASE}/api/workers/find${queryParts.length ? '?' + queryParts.join('&') : ''}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            setFinderResults(data.workers || []);
            setFinderMessage(data.message || "");
          } else {
            setFinderMessage("Unable to retrieve ASHA workers. Please check your query or try again.");
          }
        } catch (err) {
          console.error("Finder error:", err);
          setFinderMessage("Network error while searching for ASHA workers.");
        } finally {
          setFinderLoading(false);
        }
      };

      // Geolocation Lookup
      const handleUseCurrentLocation = () => {
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
        }
        setGeoStatus("Detecting GPS coordinates...");
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            setGeoStatus(`GPS: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`);
            setFinderForm(prev => ({ ...prev, lat: latitude, lon: longitude }));
            handleFinderSearch({ lat: latitude, lon: longitude });
          },
          (error) => {
            setGeoStatus("");
            alert(`Location permission denied or unavailable: ${error.message}. Please enter PIN code or Village manually.`);
          },
          { timeout: 10000 }
        );
      };

          // Role-specific navigation redirection
          if (data.user.role === 'admin') {
            setActiveTab('admin_workers');
          } else if (data.user.role === 'health_supervisor') {
            setActiveTab('supervisor_overview');
          } else {
            setActiveTab('dashboard');
          }
        } catch (err) {
          setLoginError(err.message);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("asha_user");
        localStorage.removeItem("asha_token");
        setShowLoginModal(true);
      };

      const quickSwitchRole = (u, p) => {
        setLoginForm({ username: u, password: p, showPass: false });
      };

      const viewHousehold = async (hhId) => {
        try {
          const res = await fetch(`${API_BASE}/api/households/${hhId}`, { headers: getHeaders() });
          if (res.ok) {
            setSelectedHousehold(await res.json());
          } else {
            const err = await res.json();
            alert("Access Notice: " + (err.detail || "Unable to view household"));
          }
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      // Start registering a fresh household
      const startNewHousehold = () => {
        setEditingHouseholdId(null);
        setNewHousehold(buildDefaultHouseholdState(currentUser));
        setSurveyStep(1);
        setFormErrorMsg("");
        setFieldErrors({});
        setShowSurveyModal(true);
      };

      // Start editing an existing household & its members
      const startEditHousehold = async (hhId) => {
        try {
          setLoading(true);
          const res = await fetch(`${API_BASE}/api/households/${hhId}`, { headers: getHeaders() });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Unable to fetch household for editing.");
          }
          const data = await res.json();
          const h = data.household;
          const mems = data.family_members && data.family_members.length > 0 
            ? data.family_members.map(m => ({
                id: m.id,
                full_name: m.full_name,
                age: m.age,
                gender: m.gender,
                dob: m.dob || "",
                relationship: m.relationship,
                mobile: m.mobile || "",
                occupation: m.occupation || "",
                education: m.education || "Secondary",
                marital_status: m.marital_status || "Married",
                is_pregnant: m.is_pregnant === 1,
                pregnancy_trimester: m.pregnancy_trimester || "",
                is_lactating: m.is_lactating === 1,
                is_child_under_5: m.is_child_under_5 === 1,
                requires_immunization: m.requires_immunization === 1,
                immunization_due: m.immunization_due || "",
                is_elderly: m.is_elderly === 1,
                has_disability: m.has_disability === 1,
                disability_type: m.disability_type || "",
                chronic_conditions: m.chronic_conditions || "None"
              }))
            : [
                {
                  full_name: h.head_of_family,
                  age: 35,
                  gender: "Male",
                  dob: "",
                  relationship: "Self / Head",
                  mobile: h.contact_number || "",
                  occupation: "Agriculture",
                  education: "Secondary",
                  marital_status: "Married",
                  is_pregnant: false,
                  pregnancy_trimester: "",
                  is_lactating: false,
                  is_child_under_5: false,
                  requires_immunization: false,
                  immunization_due: "",
                  is_elderly: false,
                  has_disability: false,
                  disability_type: "",
                  chronic_conditions: "None"
                }
              ];

          setNewHousehold({
            head_of_family: h.head_of_family,
            address: h.address,
            pincode: h.pincode,
            village: h.village,
            contact_number: h.contact_number || "",
            house_type: h.house_type || "Pucca",
            water_source: h.water_source || "Piped Water / Tap",
            toilet_available: h.toilet_available || "Individual Household Latrine (IHHL)",
            sanitation_facility: h.sanitation_facility || "Closed Drainage",
            survey_status: h.survey_status || "completed",
            survey_date: (data.surveys && data.surveys.length > 0) ? data.surveys[0].survey_date : new Date().toISOString().split("T")[0],
            remarks: (data.surveys && data.surveys.length > 0) ? (data.surveys[0].remarks || "") : "",
            household_code: h.household_code,
            family_members: mems
          });

          setEditingHouseholdId(hhId);
          setSurveyStep(1);
          setFormErrorMsg("");
          setFieldErrors({});
          setShowSurveyModal(true);
        } catch (err) {
          alert("Cannot Edit Household: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      // Delete confirmation execution
      const confirmDeleteAction = async () => {
        if (!deleteTarget || isDeleting) return;
        try {
          setIsDeleting(true);
          if (deleteTarget.type === 'household') {
            const res = await fetch(`${API_BASE}/api/households/${deleteTarget.id}`, {
              method: "DELETE",
              headers: getHeaders()
            });
            if (!res.ok) {
              const errData = await res.json();
              throw new Error(errData.detail || "Failed to delete household.");
            }
            setSuccessBanner({
              isDeleted: true,
              message: `Household record '${deleteTarget.code}' (${deleteTarget.name}) deleted successfully.`
            });
            if (selectedHousehold && selectedHousehold.household.id === deleteTarget.id) {
              setSelectedHousehold(null);
            }
            await loadData();
          } else if (deleteTarget.type === 'member') {
            const res = await fetch(`${API_BASE}/api/households/${deleteTarget.householdId}/members/${deleteTarget.memberId}`, {
              method: "DELETE",
              headers: getHeaders()
            });
            if (!res.ok) {
              const errData = await res.json();
              throw new Error(errData.detail || "Failed to delete family member.");
            }
            setSuccessBanner({
              isDeleted: true,
              message: `Family member '${deleteTarget.name}' deleted successfully.`
            });
            await viewHousehold(deleteTarget.householdId);
            await loadData();
          }
          setDeleteTarget(null);
        } catch (err) {
          alert("Delete Error: " + err.message);
        } finally {
          setIsDeleting(false);
        }
      };

      // Member modal openers
      const openAddMemberModal = (householdId) => {
        setMemberFormError("");
        setMemberModal({
          isOpen: true,
          isNew: true,
          householdId,
          member: {
            full_name: "",
            age: 25,
            gender: "Female",
            dob: "",
            relationship: "Daughter",
            mobile: "",
            occupation: "Homemaker",
            education: "Secondary",
            marital_status: "Married",
            is_pregnant: false,
            pregnancy_trimester: "",
            is_lactating: false,
            is_child_under_5: false,
            requires_immunization: false,
            immunization_due: "",
            is_elderly: false,
            has_disability: false,
            disability_type: "",
            chronic_conditions: "None"
          }
        });
      };

      const openEditMemberModal = (householdId, mem) => {
        setMemberFormError("");
        setMemberModal({
          isOpen: true,
          isNew: false,
          householdId,
          memberId: mem.id,
          member: {
            full_name: mem.full_name,
            age: mem.age,
            gender: mem.gender,
            dob: mem.dob || "",
            relationship: mem.relationship,
            mobile: mem.mobile || "",
            occupation: mem.occupation || "",
            education: mem.education || "Secondary",
            marital_status: mem.marital_status || "Married",
            is_pregnant: mem.is_pregnant === 1,
            pregnancy_trimester: mem.pregnancy_trimester || "",
            is_lactating: mem.is_lactating === 1,
            is_child_under_5: mem.is_child_under_5 === 1,
            requires_immunization: mem.requires_immunization === 1,
            immunization_due: mem.immunization_due || "",
            is_elderly: mem.is_elderly === 1,
            has_disability: mem.has_disability === 1,
            disability_type: mem.disability_type || "",
            chronic_conditions: mem.chronic_conditions || "None"
          }
        });
      };

      const handleSaveMember = async (e) => {
        if (e) e.preventDefault();
        if (!memberModal || isMemberSaving) return;
        const m = memberModal.member;
        if (!m.full_name.trim()) {
          setMemberFormError("Member name is required.");
          return;
        }
        const age = parseInt(m.age, 10);
        if (isNaN(age) || age < 0 || age > 125) {
          setMemberFormError("Age must be between 0 and 125.");
          return;
        }
        try {
          setIsMemberSaving(true);
          setMemberFormError("");
          const url = memberModal.isNew 
            ? `${API_BASE}/api/households/${memberModal.householdId}/members`
            : `${API_BASE}/api/households/${memberModal.householdId}/members/${memberModal.memberId}`;
          const method = memberModal.isNew ? "POST" : "PUT";
          const res = await fetch(url, {
            method,
            headers: getHeaders(),
            body: JSON.stringify({
              ...m,
              age: age,
              full_name: m.full_name.trim(),
              mobile: m.mobile ? m.mobile.trim() : null
            })
          });
          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Failed to save family member.");
          }
          setSuccessBanner({
            isDeleted: false,
            message: memberModal.isNew 
              ? `Family member '${m.full_name}' added successfully.`
              : `Family member '${m.full_name}' updated successfully.`
          });
          setMemberModal(null);
          await viewHousehold(memberModal.householdId);
          await loadData();
        } catch (err) {
          setMemberFormError(err.message);
        } finally {
          setIsMemberSaving(false);
        }
      };

      // Form Member builder helpers
      const addMemberRow = () => {
        setNewHousehold(prev => ({
          ...prev,
          family_members: [
            ...prev.family_members,
            {
              full_name: "",
              age: 25,
              gender: "Female",
              dob: "",
              relationship: "Spouse",
              mobile: "",
              occupation: "Homemaker",
              education: "Secondary",
              marital_status: "Married",
              is_pregnant: false,
              pregnancy_trimester: "",
              is_lactating: false,
              is_child_under_5: false,
              requires_immunization: false,
              immunization_due: "",
              is_elderly: false,
              has_disability: false,
              disability_type: "",
              chronic_conditions: "None"
            }
          ]
        }));
      };

      const updateMember = (index, field, value) => {
        setNewHousehold(prev => {
          const updated = [...prev.family_members];
          updated[index] = { ...updated[index], [field]: value };
          if (field === "age") {
            const numAge = parseInt(value, 10) || 0;
            updated[index].is_elderly = numAge >= 60;
            updated[index].is_child_under_5 = numAge < 5;
          }
          if (field === "dob" && value) {
            // Auto calculate age from DOB
            try {
              const birthYear = new Date(value).getFullYear();
              const curYear = new Date().getFullYear();
              const calcAge = Math.max(0, curYear - birthYear);
              updated[index].age = calcAge;
              updated[index].is_elderly = calcAge >= 60;
              updated[index].is_child_under_5 = calcAge < 5;
            } catch(e) {}
          }
          return { ...prev, family_members: updated };
        });
      };

      const removeMember = (index) => {
        if (newHousehold.family_members.length <= 1) {
          alert("A household must have at least one family head / member.");
          return;
        }
        setNewHousehold(prev => ({
          ...prev,
          family_members: prev.family_members.filter((_, i) => i !== index)
        }));
      };

      // Validation Function
      const validateHouseholdForm = (step) => {
        const errors = {};
        const head = (newHousehold.head_of_family || "").trim();
        const address = (newHousehold.address || "").trim();
        const pincode = (newHousehold.pincode || "").trim();
        const village = (newHousehold.village || "").trim();

        if (!head) {
          errors.head_of_family = "Head of Family name is required.";
        }
        if (!address) {
          errors.address = "Complete residential address is required.";
        }
        if (!pincode || !/^\d{6}$/.test(pincode)) {
          errors.pincode = "PIN code must be exactly 6 digits (numbers only).";
        }
        if (!village) {
          errors.village = "Village or Locality is required.";
        }
        // Contact number is optional — only validate format if provided
        if (newHousehold.contact_number && newHousehold.contact_number.trim()) {
          const cleanPhone = newHousehold.contact_number.replace(/[^0-9]/g, "");
          if (cleanPhone.length < 10) {
            errors.contact_number = "Mobile number must be at least 10 digits.";
          }
        }

        if (step === 2) {
          newHousehold.family_members.forEach((m, idx) => {
            const memberName = (m.full_name || "").trim();
            if (!memberName) {
              errors[`member_${idx}_name`] = `Member #${idx + 1} name is required.`;
            }
            const memberAge = parseInt(m.age, 10);
            if (isNaN(memberAge) || memberAge < 0 || memberAge > 125) {
              errors[`member_${idx}_age`] = `Member #${idx + 1} age must be 0–125.`;
            }
          });
        }

        setFieldErrors(errors);
        return Object.keys(errors).length === 0;
      };

      // Step 1 to Step 2 transition
      const handleProceedToStep2 = (e) => {
        if (e) e.preventDefault();
        setFormErrorMsg("");
        if (!validateHouseholdForm(1)) {
          return;
        }
        // If first member name is empty, sync with head of family
        if (!newHousehold.family_members[0].full_name.trim()) {
          updateMember(0, "full_name", newHousehold.head_of_family);
          updateMember(0, "mobile", newHousehold.contact_number);
        }
        setSurveyStep(2);
      };

      // Final Submission Handler (Submits and Saves to SQLite Database)
      const handleSurveySubmit = async (statusType, e) => {
        if (e) e.preventDefault();
        setFormErrorMsg("");

        if (!validateHouseholdForm(2)) {
          setFormErrorMsg("Please correct the highlighted fields before submitting.");
          return;
        }

        // Prevent double-submission
        if (isSubmitting) return;

        try {
          setIsSubmitting(true);

          // Sanitize family members
          const sanitizedMembers = newHousehold.family_members.map(m => ({
            ...m,
            full_name: (m.full_name || "").trim() || newHousehold.head_of_family,
            age: parseInt(m.age, 10) || 0,
            mobile: m.mobile ? m.mobile.trim() : null,
            dob: m.dob || null,
            immunization_due: m.immunization_due || null,
            disability_type: m.disability_type || null,
            pregnancy_trimester: m.pregnancy_trimester || null,
            chronic_conditions: m.chronic_conditions || "None"
          }));

          // Determine the best area_id:
          // 1. Use user's assigned area if set
          // 2. Find matching area from loaded areas list by pincode
          // 3. Fall back to null so backend auto-resolves by pincode/village
          let resolved_area_id = currentUser.assigned_area_id || null;
          if (!resolved_area_id && areas.length > 0) {
            const matchingArea = areas.find(a => a.pincode === newHousehold.pincode.trim());
            resolved_area_id = matchingArea ? matchingArea.id : (areas[0] ? areas[0].id : null);
          }

          const payload = {
            ...newHousehold,
            survey_status: statusType,
            survey_date: newHousehold.survey_date || new Date().toISOString().split("T")[0],
            area_id: resolved_area_id,
            family_members: sanitizedMembers
          };

          const url = editingHouseholdId 
            ? `${API_BASE}/api/households/${editingHouseholdId}` 
            : `${API_BASE}/api/households`;
          const method = editingHouseholdId ? "PUT" : "POST";

          const response = await fetch(url, {
            method: method,
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });

          let savedData;
          try {
            savedData = await response.json();
          } catch (parseErr) {
            throw new Error("Server returned an unreadable response. Please try again.");
          }

          if (!response.ok) {
            let msg = editingHouseholdId ? "Failed to update household survey." : "Failed to save household survey.";
            if (savedData && typeof savedData.detail === "string") {
              msg = savedData.detail;
            } else if (savedData && Array.isArray(savedData.detail)) {
              msg = savedData.detail.map(d => {
                const loc = d.loc ? d.loc.filter(l => l !== "body").join(" › ") : "";
                return loc ? `${loc}: ${d.msg}` : d.msg;
              }).join(" | ");
            }
            throw new Error(msg);
          }

          const householdCode = savedData.household ? savedData.household.household_code : (newHousehold.household_code || "Saved");
          const memberCount = savedData.member_count || sanitizedMembers.length;

          // Show persistent success banner
          setSuccessBanner({
            code: householdCode,
            head: newHousehold.head_of_family,
            membersCount: memberCount,
            village: newHousehold.village,
            status: statusType,
            isEdit: !!editingHouseholdId,
            message: editingHouseholdId 
              ? `Household '${householdCode}' (${newHousehold.head_of_family}) updated successfully.`
              : null
          });

          const finishedEditId = editingHouseholdId;

          // Close modal and reset form state using current user context
          setShowSurveyModal(false);
          setEditingHouseholdId(null);
          setSurveyStep(1);
          setFieldErrors({});
          setFormErrorMsg("");
          setNewHousehold(buildDefaultHouseholdState(currentUser));

          // Refresh application data and redirect to directory
          await loadData();
          if (finishedEditId && selectedHousehold && selectedHousehold.household.id === finishedEditId) {
            await viewHousehold(finishedEditId);
          }
          setActiveTab('directory');

        } catch (err) {
          console.error("Survey submission error:", err);
          setFormErrorMsg(err.message || "An unexpected network or server error occurred. Please check your connection and try again.");
        } finally {
          setIsSubmitting(false);
        }
      };

      // Simulator submit
      const submitSimulator = async () => {
        try {
          const parsed = JSON.parse(simPayload);
          const res = await fetch(`${API_BASE}/api/visits/confirm`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(parsed)
          });
          const data = await res.json();
          setSimResult({ status: res.status, ok: res.ok, data });
          if (res.ok) loadData();
        } catch (err) {
          setSimResult({ status: 0, ok: false, data: { error: err.message } });
        }
      };

      return (
        <div className="app-layout">
          {/* SIDEBAR NAVIGATION */}
          <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div className="sidebar-brand">
              <div className="brand-logo-icon">ಆ</div>
              <div className="brand-titles">
                <h1>{t.appTitle}</h1>
                <span>{t.appSubtitle}</span>
              </div>
            </div>

            <nav className="sidebar-menu">
              <button 
                className={`nav-item ${activeTab === 'finder' ? 'active' : ''}`}
                onClick={() => { setActiveTab('finder'); if (finderResults.length === 0) handleFinderSearch(); setSidebarOpen(false); }}
              >
                <span className="icon">🔍</span>
                <span>{t.navFinder}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`}
                onClick={() => { setActiveTab('dashboard'); setSidebarOpen(false); }}
              >
                <span className="icon">📊</span>
                <span>{t.navDashboard}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'survey' ? 'active' : ''}`}
                onClick={() => { setActiveTab('survey'); setSidebarOpen(false); }}
              >
                <span className="icon">📋</span>
                <span>{t.navSurvey}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'directory' ? 'active' : ''}`}
                onClick={() => { setActiveTab('directory'); setSidebarOpen(false); }}
              >
                <span className="icon">🏠</span>
                <span>{t.navDirectory}</span>
                <span className="nav-badge">{households.length}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'areas' ? 'active' : ''}`}
                onClick={() => { setActiveTab('areas'); setSidebarOpen(false); }}
              >
                <span className="icon">📍</span>
                <span>{t.navAreas}</span>
                <span className="nav-badge">{areas.length}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'health_records' ? 'active' : ''}`}
                onClick={() => { setActiveTab('health_records'); setSidebarOpen(false); }}
              >
                <span className="icon">🩺</span>
                <span>{t.navHealthRecords}</span>
                <span className="nav-badge">{phase3Visits.length}</span>
              </button>

              <button 
                className={`nav-item ${activeTab === 'reports' ? 'active' : ''}`}
                onClick={() => { setActiveTab('reports'); setSidebarOpen(false); }}
              >
                <span className="icon">📈</span>
                <span>{t.navReports}</span>
              </button>

              {currentUser.role === 'admin' && (
                <button 
                  className={`nav-item ${activeTab === 'admin_workers' ? 'active' : ''}`}
                  onClick={() => { setActiveTab('admin_workers'); setSidebarOpen(false); }}
                >
                  <span className="icon">👷</span>
                  <span>{t.navAdminWorkers || 'Worker Management'}</span>
                </button>
              )}

              {(currentUser.role === 'health_supervisor' || currentUser.role === 'admin') && (
                <button 
                  className={`nav-item ${activeTab === 'supervisor_overview' ? 'active' : ''}`}
                  onClick={() => { setActiveTab('supervisor_overview'); setSidebarOpen(false); }}
                >
                  <span className="icon">👁️</span>
                  <span>{t.navSupervisor || 'Supervisor Overview'}</span>
                </button>
              )}

              <button 
                className={`nav-item ${activeTab === 'profile' ? 'active' : ''}`}
                onClick={() => { setActiveTab('profile'); setSidebarOpen(false); }}
              >
                <span className="icon">👤</span>
                <span>{t.navProfile}</span>
              </button>
            </nav>

            <div className="sidebar-footer">
              <div className="user-pill">
                <div className="user-avatar">
                  {currentUser.full_name ? currentUser.full_name[0] : "A"}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {currentUser.full_name}
                  </div>
                  <div style={{ fontSize: "11px", color: "var(--teal)", fontWeight: 700, textTransform: "uppercase" }}>
                    {currentUser.role.replace("_", " ")}
                  </div>
                </div>
                <button 
                  onClick={handleLogout}
                  title="Logout / Switch User"
                  style={{ background: "none", border: "none", cursor: "pointer", fontSize: "16px" }}
                >
                  🚪
                </button>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="content-wrapper">
            {/* Top Bar with Scoped Area Indicator and Language Switch */}
            <header className="top-bar">
              <button className="mobile-menu-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>
                ☰
              </button>

              <div className="location-scope-banner">
                <span>📍</span>
                <span>
                  <strong>{currentUser.assigned_village || 'All Villages'}:</strong> {currentUser.assigned_area_name || 'Global Access'} (PIN: {currentUser.assigned_pincode || 'Karnataka'})
                </span>
                <span className="badge badge-info" style={{ fontSize: "10px" }}>
                  {currentUser.role === 'admin' ? 'ADMINISTRATOR' : 'SCOPED ACCESS'}
                </span>
              </div>

              <div className="top-actions">
                <button 
                  className={`btn btn-sm ${activeTab === 'finder' ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => { setActiveTab('finder'); if (finderResults.length === 0) handleFinderSearch(); }}
                  title="Find Officially Assigned ASHA Worker"
                >
                  <span>🔍</span> {t.navFinder || 'Find ASHA Worker'}
                </button>

                <button 
                  className="btn btn-sm btn-secondary"
                  onClick={() => setShowLoginModal(true)}
                  title="ASHA Worker Login Portal"
                >
                  <span>🔐</span> {t.workerLoginPortal || 'Worker Login'}
                </button>

                <button 
                  className="lang-toggle-btn"
                  onClick={() => setLang(lang === 'en' ? 'kn' : 'en')}
                  title="Switch between English and Kannada"
                >

                        className="input-control" 
                        value={newWorkerForm.phc_name}
                        onChange={(e) => setNewWorkerForm({ ...newWorkerForm, phc_name: e.target.value })}
                      />
                    </div>

                    <div>
                      <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>Assign Geographical Service Area</label>
                      <select 
                        className="select-input" 
                        value={newWorkerForm.assigned_area_id}
                        onChange={(e) => setNewWorkerForm({ ...newWorkerForm, assigned_area_id: e.target.value })}
                        style={{ width: "100%", height: "42px" }}
                      >
                        <option value="">-- Select Service Area / Village --</option>
                        {areas.map(a => (
                          <option key={a.id} value={a.id}>
                            {a.village} - {a.area_name} (PIN: {a.pincode})
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="modal-foot">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowRegisterWorkerModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-teal">Register Worker</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EDIT / REASSIGN ASHA WORKER MODAL (ADMIN ONLY) */}
          {editingWorker && (
            <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) setEditingWorker(null); }}>
              <div className="modal-sheet" style={{ maxWidth: "600px" }}>
                <div className="modal-head">
                  <h3 style={{ fontSize: "18px", fontWeight: 800 }}>✏️ Edit Profile & Reassign Area</h3>
                  <button type="button" className="btn btn-sm btn-secondary" onClick={() => setEditingWorker(null)}>✕</button>
                </div>
                <form onSubmit={handleUpdateWorker}>
                  <div className="modal-body" style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
                      <div>
                        <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>Full Name</label>
                        <input 
                          type="text" 
                          className="input-control" 
                          value={editingWorker.full_name || ""}
                          onChange={(e) => setEditingWorker({ ...editingWorker, full_name: e.target.value })}
                          required
                        />
                      </div>
                      <div>
                        <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>Official Badge ID</label>
                        <input 
                          type="text" 
                          className="input-control" 
                          value={editingWorker.badge_id || ""}
                          onChange={(e) => setEditingWorker({ ...editingWorker, badge_id: e.target.value })}
                        />
                      </div>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
                      <div>
                        <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>Work Contact Number</label>
                        <input 
                          type="text" 
                          className="input-control" 
                          value={editingWorker.work_contact || editingWorker.mobile || ""}
                          onChange={(e) => setEditingWorker({ ...editingWorker, work_contact: e.target.value })}
                        />
                      </div>
                      <div>
                        <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>PHC Name</label>
                        <input 
                          type="text" 
                          className="input-control" 
                          value={editingWorker.phc_name || ""}
                          onChange={(e) => setEditingWorker({ ...editingWorker, phc_name: e.target.value })}
                        />
                      </div>
                    </div>

                    <div>
                      <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>
                        Assigned Geographical Area / Village (Reassignment)
                      </label>
                      <select 
                        className="select-input" 
                        value={editingWorker.assigned_area_id || ""}
                        onChange={(e) => setEditingWorker({ ...editingWorker, assigned_area_id: e.target.value })}
                        style={{ width: "100%", height: "42px" }}
                      >
                        <option value="">-- No Area Assigned --</option>
                        {areas.map(a => (
                          <option key={a.id} value={a.id}>
                            {a.village} - {a.area_name} (PIN: {a.pincode})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div style={{ display: "flex", gap: "20px", marginTop: "6px" }}>
                      <label style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", fontWeight: 700, cursor: "pointer" }}>
                        <input 
                          type="checkbox" 
                          checked={editingWorker.is_active === 1 || editingWorker.is_active === true}
                          onChange={(e) => setEditingWorker({ ...editingWorker, is_active: e.target.checked ? 1 : 0 })}
                        />
                        Active Account (Can Log In)
                      </label>

                      <label style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", fontWeight: 700, cursor: "pointer" }}>
                        <input 
                          type="checkbox" 
                          checked={editingWorker.is_verified === 1 || editingWorker.is_verified === true}
                          onChange={(e) => setEditingWorker({ ...editingWorker, is_verified: e.target.checked ? 1 : 0 })}
                        />
                        Verified & Department Approved
                      </label>
                    </div>
                  </div>
                  <div className="modal-foot">
                    <button type="button" className="btn btn-secondary" onClick={() => setEditingWorker(null)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RESET WORKER PASSWORD MODAL (ADMIN ONLY) */}
          {resetPassWorker && (
            <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) setResetPassWorker(null); }}>
              <div className="modal-sheet" style={{ maxWidth: "420px" }}>
                <div className="modal-head">
                  <h3 style={{ fontSize: "17px", fontWeight: 800 }}>🔑 Reset Password</h3>
                  <button type="button" className="btn btn-sm btn-secondary" onClick={() => setResetPassWorker(null)}>✕</button>
                </div>
                <form onSubmit={handleResetPassword}>
                  <div className="modal-body" style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                    <p style={{ fontSize: "13px", color: "var(--gray-700)" }}>
                      Resetting password for <strong>{resetPassWorker.full_name}</strong> (@{resetPassWorker.username}).
                    </p>
                    <div>
                      <label style={{ display: "block", fontSize: "12.5px", fontWeight: 700, marginBottom: "4px" }}>New Password *</label>
                      <input 
                        type="text" 
                        className="input-control" 
                        value={resetPassForm.new_password}
                        onChange={(e) => setResetPassForm({ new_password: e.target.value })}
                        required
                        minLength={4}
                      />
                    </div>
                  </div>
                  <div className="modal-foot">
                    <button type="button" className="btn btn-secondary" onClick={() => setResetPassWorker(null)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Confirm Password Reset</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
